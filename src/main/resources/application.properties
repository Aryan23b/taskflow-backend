spring.application.name=task_manager


# Locally it falls back to 8080.
server.port=${PORT:8080}


#postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Recommended for this project
spring.jpa.open-in-view=false

# Hikari connection pool
spring.datasource.hikari.maximum-pool-size=5

# CORS
APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


